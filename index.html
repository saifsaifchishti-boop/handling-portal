<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMS Handler</title>
<style>

@media(max-width:800px){nav{display:none}nav.open{display:block;position:fixed;top:56px;left:0;bottom:0;z-index:8;box-shadow:4px 0 20px #0005}#top input,.adm{display:none}.hb2{display:block}#top .br{min-width:0}}
</style></head><body><div id="app"></div><div id="ts"></div><div id="md" style="display:none"></div>
<script>
const K='lmsh_v1',$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def={set:{brand:'Virtual University',sub:'LMS Handler — Student Management',admin:'LMS Handler',user:'admin',pass:'admin123',accent:'#1a73e8',lms:'https://vulms.vu.edu.pk/',cur:'Rs',per:10,programs:['BS Computer Science','BS English','BS Business Admin','BS Psychology','BS Mathematics','BS IT','BS Education','BS Physics','BS Chemistry','BS Media Studies'],semesters:['1st','2nd','3rd','4th','5th','6th','7th','8th'],issuer:'SAIF CHISTI',issuerSub:'VU OFFICIAL',support:'',payinfo:'JazzCash: 03XX-XXXXXXX (Account Name)\nEasypaisa: 03XX-XXXXXXX (Account Name)\nBank: IBAN / Account No.',dark:false,al:0,auto:0,sbu:'',sbk:'',lb:0,admins:[],speed:70,typing:true,bism:true,tag:'Professional handling for Assignments, Quizzes, GDBs and complete LMS management.',phrases:['اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ','لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَسُولُ اللّٰهِ ﷺ','سُبْحَانَ اللّٰهِ وَبِحَمْدِهٖ','أَسْتَغْفِرُ اللّٰهَ رَبِّي مِنْ كُلِّ ذَنْبٍ','صَلَّى اللّٰهُ عَلَيْهِ وَسَلَّم']},st:[],rm:[],log:[]};
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||def;D.set={...def.set,...D.set};D.rm=D.rm||[];D.log=D.log||[];D.trash=D.trash||[];
let _t;const S=n=>{localStorage.setItem(K,JSON.stringify(D));if(!n&&U().sbu&&U().sbk&&U().auto){clearTimeout(_t);_t=setTimeout(()=>cloud('push'),2500)}},U=()=>D.set,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const gs=id=>D.st.find(s=>s.id==id),log=m=>{D.log.unshift({t:Date.now(),m});D.log=D.log.slice(0,40);S()};
const ago=t=>{let m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
let V='dash',SID=null,Q={q:'',p:'',se:'',s:'',f:''},PG=1,SEL=new Set(),TAB='info',NB=false,PH,FP=0,WF=0;
const toast=m=>{const d=document.createElement('div');d.textContent=m;$('#ts').append(d);setTimeout(()=>d.remove(),3500)};
const go=(v,id)=>{V=v;SID=id||null;NB=false;MN=false;if(v=='st')PG=1;if(v=='add'){PH=undefined}R();scrollTo(0,0)};
const modal=h=>{$('#md').style.display='grid';$('#md').innerHTML='<div>'+h+'</div>'},close=()=>$('#md').style.display='none';
const av=s=>s.photo?`<img class=av src="${s.photo}">`:`<span class=av>${E((s.name||'?')[0])}</span>`;
const pill=s=>`<span class="p ${s.replace(/ /g,'')}">${s}</span>`;
function auth(){return sessionStorage.getItem('lh_ok')=='1'}
function login(){const a=[{user:U().user,pass:U().pass}].concat(U().admins||[]);if(a.some(x=>x.user==$('#lu').value&&x.pass==$('#lp').value)){sessionStorage.setItem('lh_ok','1');R()}else toast('Wrong username or password')}
function out(){sessionStorage.removeItem('lh_ok');R()}
function R(){document.body.classList.toggle('dk',!!U().dark);document.documentElement.style.setProperty('--a',U().accent);document.title=U().brand+' — '+U().admin;
 if(!auth()){$('#app').innerHTML=`<div class="card lg">${hero()}<h2>🎓 ${E(U().brand)}</h2><p class=sub>${E(U().sub)}</p><label class=mut>Username</label><input id=lu><br><br><label class=mut>Password</label><input id=lp type=password onkeydown="if(event.key=='Enter')login()"><br><br><button onclick="login()" style="width:100%">Login</button></div>`;return}
 const nav=NV;const _o=[['dash','🏠','Dashboard'],['st','👥','All Students'],['add','➕','Add Student'],['fee','💰','Fee Management'],['wk','📝','Quiz / GDB / Work'],['bk','📚','Books'],['rm','⏰','Reminders'],['set','⚙️','Settings']];
 const fd=D.st.filter(s=>pend(s)>0&&s.due&&new Date(s.due)<new Date());const od=fd.length+D.rm.filter(r=>!r.done&&new Date(r.at)<=new Date()).length;
 $('#app').innerHTML=`<div id=top><button class="g hb2" onclick="MN=!MN;R()">☰</button><div class=br><b>🎓 ${E(U().brand)}</b><small>${E(U().sub)}</small></div>
 <input placeholder="Search students by name, CNIC, roll no, email... (Enter)" onkeydown="if(event.key=='Enter'){Q={q:this.value,p:'',se:'',s:'',f:''};go('st')}">
 <span id=clk></span><div class=bell onclick="NB=!NB;R()">🔔<i>${od}</i></div><div class=adm><b>${E(U().admin)}</b><small>System Administrator</small></div><button class=g onclick="out()">Logout</button></div>
 ${NB?'<div id=nb>'+(D.rm.filter(r=>!r.done).sort((a,b)=>a.at>b.at?1:-1).slice(0,10).map(r=>`<div>${new Date(r.at)<=new Date()?'🔴':'🟡'} ${E(r.text)}<br><span class=mut>${new Date(r.at).toLocaleString()}${r.sid&&gs(r.sid)?' · '+E(gs(r.sid).name):''}</span></div>`).join('')+fd.map(s=>`<div>💸 Fee overdue: ${E(s.name)} (${mn(pend(s))})</div>`).join('')||'<div>Nothing pending</div>')+'</div>':''}
 <div id=lay><nav class="${MN?'open':''}">${nav.map(n=>n.length<2?`<h6>${n[0]}</h6>`:`<a class="${V==n[0]||(V=='det'&&n[0]=='st')?'on':''}" onclick="${n[0][0]=='@'?`act('${n[0]}')`:`go('${n[0]}')`}">${n[1]} ${n[2]}</a>`).join('')}</nav><main>${VW()}</main></div>`;
 tick();if(V=='set'&&$('#bm'))$('#bm').href=BM}
const VW=()=>({dash,st:stv,add:()=>form(),edit:()=>form(gs(SID)),det,fee,wk,bk,rm:rmv,set:setv,imp:impv,fnd:fndv,flg:flgv,an:anv,lg:lgv,tr:trv})[V]();
/* DASHBOARD */
function dash(){const a=D.st,pf=a.filter(s=>pend(s)>0),tp=pf.reduce((x,s)=>x+pend(s),0);
 const c=(i,l,v,x)=>`<div class="card st"><div class=ic>${i}</div><div><span class=mut>${l}</span><b>${v}</b><span class=mut>${x||''}</span></div></div>`;
 return hero(1)+(Date.now()-(U().lb||0)>6048e5?'<div class=card>⚠️ No backup in the last 7 days — Settings → Export backup (or enable Cloud sync).</div>':'')+`<div class=hd><div><h2>Dashboard</h2><p class=sub>Manage all your ${E(U().brand)} students in one place.</p></div><button onclick="go('add')">+ Add New Student</button></div>
 <div class=grid>${c('👥','Total Students',a.length)}${c('🎓','Active',a.filter(s=>s.status=='Active').length)}${c('⏸️','On Hold',a.filter(s=>s.status=='On Hold').length)}${c('💸','Pending Fees',pf.length,mn(tp))}${c('🚩','Flagged',a.filter(s=>s.flag||s.ff).length)}${c('⏰','Reminders Due',D.rm.filter(r=>!r.done&&new Date(r.at)<=new Date()).length)}</div>
 <div class=grid style="grid-template-columns:1fr 1fr"><div class=card><h3>Upcoming reminders</h3>${D.rm.filter(r=>!r.done).sort((a,b)=>a.at>b.at?1:-1).slice(0,6).map(r=>`<p>⏰ ${E(r.text)} <span class=mut>${new Date(r.at).toLocaleString()}</span></p>`).join('')||'<p class=mut>None</p>'}</div>
 <div class=card><h3>Recent activity</h3>${D.log.slice(0,8).map(l=>`<p>• ${E(l.m)} <span class=mut>${ago(l.t)}</span></p>`).join('')||'<p class=mut>No activity yet</p>'}</div></div>`}
/* STUDENTS */
function flt(){const q=Q.q.toLowerCase();return D.st.filter(s=>(!q||[s.name,s.cnic,s.roll,s.email,s.lu,s.phone].join(' ').toLowerCase().includes(q))&&(!Q.p||s.program==Q.p)&&(!Q.se||s.sem==Q.se)&&(!Q.s||s.status==Q.s)&&(!Q.f||s.flag||s.ff))}
function tbl(){const L=flt(),n=U().per,pgs=Math.max(1,Math.ceil(L.length/n));PG=Math.min(PG,pgs);const P=L.slice((PG-1)*n,PG*n);
 return `<div class=tw><table><tr><th><input type=checkbox style="width:auto" onchange="P_${'sa'}(this.checked)"></th><th>#</th><th>Photo</th><th>Name</th><th>Roll No</th><th>CNIC</th><th>Program</th><th>Sem</th><th>Status</th><th>Fee Pending</th><th>Actions</th></tr>
 ${P.map((s,i)=>`<tr><td><input type=checkbox style="width:auto" ${SEL.has(s.id)?'checked':''} onchange="tg('${s.id}',this.checked)"></td><td>${(PG-1)*n+i+1}</td><td>${av(s)}</td><td><b>${s.flag?'<span class=fl>🚩</span> ':''}${E(s.name)}</b><br><span class=mut>${E(s.email)}</span></td><td>${E(s.roll)}</td><td>${E(s.cnic)}</td><td>${E(s.program)}</td><td>${E(s.sem)}</td><td>${pill(s.status)}</td><td>${pend(s)?`<span class=fl>${mn(pend(s))}</span>`:'—'}</td>
 <td><button class="s" title="Open LMS & login" onclick="lms('${s.id}')">🔑 LMS</button> <button class="s g" onclick="go('det','${s.id}')">👁</button> <button class="s g" onclick="go('edit','${s.id}')">✏️</button> <button class="s g" onclick="fl('${s.id}')">🚩</button> <button class="s r" onclick="del('${s.id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan=11 class=mut>No students found</td></tr>'}</table></div>
 <div class=pg><span class=mut style="margin-right:auto">Showing ${L.length?(PG-1)*n+1:0} to ${Math.min(PG*n,L.length)} of ${L.length}</span>${Array.from({length:pgs},(_,i)=>`<button class="${i+1==PG?'on':''}" onclick="PG=${i+1};up()">${i+1}</button>`).join('')}</div>`}
const up=()=>{$('#tbl').innerHTML=tbl()};
window['P_sa']=c=>{flt().forEach(s=>c?SEL.add(s.id):SEL.delete(s.id));up()};
const tg=(id,c)=>{c?SEL.add(id):SEL.delete(id)};
function stv(){const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('');
 return `<div class=hd><div><h2>Student Management</h2><p class=sub>All students, filters & bulk actions</p></div><div><button class=g onclick="csv()">⬇ Export CSV</button> <button onclick="go('add')">+ Add New Student</button></div></div><div class=card>
 <div class=f><input placeholder="Search students..." value="${E(Q.q)}" oninput="Q.q=this.value;PG=1;up()"><select onchange="Q.p=this.value;PG=1;up()"><option value="">All Programs</option>${o(U().programs,Q.p)}</select><select onchange="Q.se=this.value;PG=1;up()"><option value="">All Semesters</option>${o(U().semesters,Q.se)}</select><select onchange="Q.s=this.value;PG=1;up()"><option value="">All Status</option>${o(['Active','On Hold','Inactive','Pending Fee'],Q.s)}</select><select onchange="Q.f=this.value;PG=1;up()"><option value="">All</option><option value=1 ${Q.f?'selected':''}>🚩 Flagged only</option></select><button class=g onclick="Q={q:'',p:'',se:'',s:'',f:''};R()">Clear</button></div>
 <div class=f><select id=bs><option value="">Bulk: set status…</option><option>Active</option><option>On Hold</option><option>Inactive</option><option>Pending Fee</option></select><button class=g onclick="bulk('st')">Apply to selected</button><button class=g onclick="bulk('fl')">🚩 Flag selected</button><button class=r onclick="bulk('del')">Delete selected</button></div>
 <div id=tbl>${tbl()}</div></div>`}
function bulk(a){if(!SEL.size)return toast('Select students first');
 if(a=='del'){if(!confirm('Delete '+SEL.size+' students?'))return;D.st.filter(s=>SEL.has(s.id)).forEach(s=>D.trash.unshift({...s,_d:Date.now()}));D.st=D.st.filter(s=>!SEL.has(s.id));log(SEL.size+' students moved to trash')}
 else if(a=='fl')D.st.forEach(s=>SEL.has(s.id)&&(s.flag=1));
 else{const v=$('#bs').value;if(!v)return toast('Pick a status');D.st.forEach(s=>SEL.has(s.id)&&(s.status=v));log('Bulk status → '+v)}
 SEL.clear();S();R()}

function del(id){const s=gs(id);if(!confirm('Move '+s.name+' to Trash?'))return;D.trash.unshift({...s,_d:Date.now()});D.st=D.st.filter(x=>x.id!=id);log('Student moved to trash: '+s.name);S();go('st')}
function csv(){const h=['name','roll','cnic','email','phone','program','sem','status','lu','lp','fee'],r=[h.concat(['paid','pending']).join(',')].concat(D.st.map(s=>h.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').concat([paid(s),pend(s)]).join(',')));dl('students.csv',r.join('\n'),'text/csv')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}

function lms(id){const s=gs(id);if(!s.lu)return toast('No LMS username saved');
 navigator.clipboard&&navigator.clipboard.writeText(s.lu+'\n'+s.lp).catch(()=>{});

const BM="javascript:(function(){var m=location.hash.match(/lh=([^&]*)&lp=(.*)/);if(!m){alert('No student data');return}var u=decodeURIComponent(m[1]),p=decodeURIComponent(m[2]);var I=[].slice.call(document.querySelectorAll('input')),P=I.filter(function(i){return i.type=='password'})[0],T=I.filter(function(i){return(!i.type||i.type=='text'||i.type=='email')&&i.offsetParent})[0];function f(e,v){if(!e)return;e.focus();e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}f(T,u);f(P,p)})()";

function form(s){const e=!!s;s=s||{};if(PH===undefined)PH=s.photo||'';const v=k=>E(s[k]??''),op=(a,x)=>a.map(i=>`<option ${i==x?'selected':''}>${E(i)}</option>`).join('');
 const I=(k,l,t)=>`<div><label>${l}</label><input id=f_${k} type=${t||'text'} value="${v(k)}"></div>`;

 ${I('name','Full Name *')}${I('roll','Roll No')}${I('cnic','CNIC')}${I('email','Email','email')}${I('phone','Phone / WhatsApp (92300...)')}${I('father','Father Name')}${I('dob','Date of Birth','date')}${I('gender','Gender')}${I('city','City')}${I('addr','Address')}${I('batch','Batch / Session')}${I('emerg','Emergency Contact')}

async function mkCard(o){const u=U(),W=900,P=40,RH=42,pay=(o.pay||'').split('\n').map(x=>x.trim()).filter(Boolean);const H=190+o.info.length*36+60+(o.rows.length+1)*RH+30+o.tot.length*50+(pay.length?70+pay.length*30:0)+120;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const fit=(t,w)=>{t=String(t??'');if(x.measureText(t).width<=w)return t;while(t.length>2&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
 x.fillStyle='#fff';x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,W,140);g.addColorStop(0,u.accent);g.addColorStop(1,'#1e1b4b');x.fillStyle=g;x.fillRect(0,0,W,150);
 x.textAlign='center';x.fillStyle='#fff';x.font='bold 42px sans-serif';x.fillText(u.issuer,W/2,58);x.fillStyle='#fde68a';x.font='bold 20px sans-serif';x.fillText(u.issuerSub+'  •  '+u.brand,W/2,90);x.fillStyle='#fff';x.font='bold 26px sans-serif';x.fillText(o.title,W/2,132);
 let y=190;x.textAlign='left';const im=o.photo?await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(0);i.src=o.photo}):0;
 if(im){x.save();x.beginPath();x.arc(W-P-48,y+60,48,0,7);x.clip();x.drawImage(im,W-P-96,y+12,96,96);x.restore()}
 o.info.forEach(([a,b])=>{x.fillStyle='#64748b';x.font='18px sans-serif';x.fillText(a,P,y);x.fillStyle='#0f172a';x.font='bold 22px sans-serif';x.fillText(fit(b,480),P+170,y);y+=36});y+=20;
 x.fillStyle='#eef2f7';x.fillRect(P,y-28,W-2*P,RH);x.fillStyle='#334155';x.font='bold 18px sans-serif';x.fillText('ITEM',P+12,y);x.textAlign='right';x.fillText(o.col.toUpperCase(),W-P-12,y);x.textAlign='left';y+=RH;
 o.rows.forEach((r,i)=>{if(i%2){x.fillStyle='#f8fafc';x.fillRect(P,y-28,W-2*P,RH)}x.fillStyle='#0f172a';x.font='20px sans-serif';x.fillText(fit(r[0],520),P+12,y);x.textAlign='right';x.fillText(fit(r[1],220),W-P-12,y);x.textAlign='left';y+=RH});
 x.strokeStyle='#cbd5e1';x.beginPath();x.moveTo(P,y-26);x.lineTo(W-P,y-26);x.stroke();y+=14;
 o.tot.forEach(t=>{x.fillStyle='#334155';x.font='bold 24px sans-serif';x.fillText(t[0],P+12,y);x.fillStyle=t[2]||'#0f172a';x.textAlign='right';x.font='bold 28px sans-serif';x.fillText(t[1],W-P-12,y);x.textAlign='left';y+=50});
 if(pay.length){y+=10;x.fillStyle='#fef3c7';x.fillRect(P,y-28,W-2*P,pay.length*30+52);x.fillStyle='#92400e';x.font='bold 20px sans-serif';x.fillText('Pay via:',P+14,y);y+=32;x.font='20px sans-serif';pay.forEach(p=>{x.fillText(fit(p,W-2*P-28),P+14,y);y+=30});y+=14}
